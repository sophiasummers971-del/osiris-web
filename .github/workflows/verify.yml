name: Verify OSIRIS
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Rule Zero decision and provider-probe tests
        run: node --test scripts/rule-zero/*.test.mjs
      - run: pnpm install --frozen-lockfile
      - name: Temporary formatting diagnostics (draft branch only)
        run: |
          pnpm exec prettier --write docs/security/CAT-START-01-HUMAN-APPROVAL-BOUNDARY.md scripts/rule-zero/trusted-approval.mjs scripts/rule-zero/trusted-approval.test.mjs
          for file in docs/security/CAT-START-01-HUMAN-APPROVAL-BOUNDARY.md scripts/rule-zero/trusted-approval.mjs scripts/rule-zero/trusted-approval.test.mjs; do
            echo "FORMAT_FILE:$file"
            base64 -w 0 "$file"
            echo
            echo FORMAT_END
          done
      - run: pnpm verify
