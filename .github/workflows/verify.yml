name: Verify OSIRIS
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Rule Zero decision and provider-probe tests
        run: node --test scripts/rule-zero/*.test.mjs
      - run: pnpm install --frozen-lockfile
      - name: Temporary staging-doc formatter diagnostic
        run: |
          pnpm exec prettier --write docs/security/CAT-START-01-STAGING-ACCEPTANCE.md
          echo FORMAT_FILE:docs/security/CAT-START-01-STAGING-ACCEPTANCE.md
          base64 -w 0 docs/security/CAT-START-01-STAGING-ACCEPTANCE.md
          echo
          echo FORMAT_END
      - run: pnpm verify
