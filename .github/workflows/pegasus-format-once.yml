name: One-off PEGASUS format repair
on:
  push:
    paths:
      - ".github/workflows/pegasus-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only three PEGASUS files
        run: pnpm exec prettier --write server/pegasus-pipeline-policy.ts server/pegasus-pipeline-policy.test.ts docs/PEGASUS-RECOVERY-CUSTODY-CONTRACT.md
      - name: Commit only formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- server/pegasus-pipeline-policy.ts server/pegasus-pipeline-policy.test.ts docs/PEGASUS-RECOVERY-CUSTODY-CONTRACT.md
          if ! git diff --cached --quiet; then
            git commit -m "style(pegasus): apply repository Prettier to three files"
            git push origin HEAD:feat/pegasus-four-pipeline-safety-core-20261029
          fi
