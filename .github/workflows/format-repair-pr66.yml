name: One-time PR66 formatting repair
on:
  push:
    branches:
      - fix/staging-vault-baseline-preflight-20261030
    paths:
      - .github/workflows/format-repair-pr66.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format exact three files only
        run: pnpm exec prettier --write contracts/pegasus-osiris/CONTRACT-v1.md contracts/pegasus-osiris/envelope.v1.schema.json docs/security/STAGING-BASELINE-RECOVERY-2026-10-30.md
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- contracts/pegasus-osiris/CONTRACT-v1.md contracts/pegasus-osiris/envelope.v1.schema.json docs/security/STAGING-BASELINE-RECOVERY-2026-10-30.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style: apply project Prettier formatting to contract and recovery docs"
            git push
          fi
