name: Pegasus fence format once
on:
  push:
    paths:
      - ".github/workflows/pegasus-fence-format-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write pegasus-staging/durable-fence.ts pegasus-staging/durable-fence.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pegasus-staging/durable-fence.ts pegasus-staging/durable-fence.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(pegasus): format durable fence"
            git push origin HEAD:feat/pegasus-staging-observer-20261029
          fi
